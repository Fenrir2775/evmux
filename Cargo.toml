[package]
name = "evmux"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"

authors = ["Fenrir <fenrir.git@gmail.com>"]
homepage = "https://github.com/Fenrir2775/evmux"
repository = "https://github.com/Fenrir2775/evmux"
description = "A linux input remapper"
keywords = ["uinput", "keyboard", "mouse", "remapper", "gaming"]

[dependencies]
anyhow = "1.0.104"
evdev = "0.13.2"
dirs = "6.0.0"
nix = { version = "0.31.3", features = ["event"] }
crossbeam-channel = "0.5.16"
smallvec = "1.15.2"
toml = "0.9.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
clap = { version = "4.6.6", features = ["derive"] }
inotify = "0.11.5"

[dev-dependencies]
tempfile = "3.27.0"
serial_test = "4.0.1"